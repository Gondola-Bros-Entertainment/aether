name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Gate compiler and package builds on static analysis and sanitizer tests.
jobs:
  cppcheck:
    name: cppcheck
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    env:
      CPPCHECK_VERSION: 2.21.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache cppcheck
        id: cppcheck-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cppcheck
          key: cppcheck-${{ env.CPPCHECK_VERSION }}-ubuntu24-${{ runner.arch }}-v1
      - name: Check out cppcheck source
        if: steps.cppcheck-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cppcheck-opensource/cppcheck
          ref: e73bf44c3e49686b7495fab352d03a6c6075516b # 2.21.0
          path: .tools/cppcheck
          persist-credentials: false
      - name: Build cppcheck
        if: steps.cppcheck-cache.outputs.cache-hit != 'true'
        run: |
          cmake -S .tools/cppcheck -B "$RUNNER_TEMP/cppcheck-build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/cppcheck" \
            -DBUILD_GUI=OFF -DBUILD_TESTS=OFF
          cmake --build "$RUNNER_TEMP/cppcheck-build" --parallel 2
          cmake --install "$RUNNER_TEMP/cppcheck-build"
      - name: Run cppcheck
        run: |
          "$RUNNER_TEMP/cppcheck/bin/cppcheck" --version
          test "$("$RUNNER_TEMP/cppcheck/bin/cppcheck" --version)" = "Cppcheck $CPPCHECK_VERSION"
          "$RUNNER_TEMP/cppcheck/bin/cppcheck" \
            --enable=warning,performance,portability --std=c++20 \
            --error-exitcode=1 --quiet -I include src test bench examples

  # The official LLVM build runs .clang-tidy over every translation unit outside test/, with warnings
  # as errors. CMAKE_OSX_SYSROOT writes the SDK into the compile database, since a non-Apple
  # clang-tidy cannot find the system headers without it. The analyzer follows paths only from
  # functions in the main file unless it is told to analyze headers, and nearly all of the library
  # is header code.
  clang-tidy:
    name: clang-tidy
    timeout-minutes: 20
    runs-on: macos-26
    env:
      LLVM_VERSION: 22.1.7
      LLVM_SHA256: 4177245188b0a30a6539c96b361dea56f253485756bfd8927a6a59e7301e7806
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache LLVM
        id: llvm-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/llvm
          key: llvm-${{ env.LLVM_VERSION }}-macos26-${{ runner.arch }}-v1
      - name: Download LLVM
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        run: |
          archive="LLVM-$LLVM_VERSION-macOS-ARM64"
          curl -fsSL -o "$RUNNER_TEMP/llvm.tar.xz" \
            "https://github.com/llvm/llvm-project/releases/download/llvmorg-$LLVM_VERSION/$archive.tar.xz"
          echo "$LLVM_SHA256  $RUNNER_TEMP/llvm.tar.xz" | shasum -a 256 -c
          mkdir -p "$RUNNER_TEMP/llvm"
          tar -xJf "$RUNNER_TEMP/llvm.tar.xz" -C "$RUNNER_TEMP/llvm" --strip-components 1 \
            "$archive/bin/clang-tidy" "$archive/bin/run-clang-tidy" "$archive/lib/clang/${LLVM_VERSION%%.*}/include"
          rm "$RUNNER_TEMP/llvm.tar.xz"
      - name: Configure
        run: cmake -B build -DCMAKE_OSX_SYSROOT=macosx
      - name: Run clang-tidy
        run: |
          version="$("$RUNNER_TEMP/llvm/bin/clang-tidy" --version)"
          echo "$version"
          grep -Fqx "  LLVM version $LLVM_VERSION" <<< "$version"
          "$RUNNER_TEMP/llvm/bin/run-clang-tidy" -clang-tidy-binary "$RUNNER_TEMP/llvm/bin/clang-tidy" \
            -p build -quiet -warnings-as-errors='*' -source-filter "^(?!$PWD/test/)" \
            -extra-arg=-Xclang -extra-arg=-analyzer-opt-analyze-headers

  sanitizers:
    name: asan + ubsan
    needs: [cppcheck, clang-tidy]
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DAETHER_WERROR=ON -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -g"
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 120

  build-test:
    name: ${{ matrix.os }} / ${{ matrix.cc }}
    needs: sanitizers
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04,     cc: gcc,   cxx: g++ }
          - { os: ubuntu-24.04-arm, cc: gcc,   cxx: g++ }
          - { os: ubuntu-24.04,     cc: clang, cxx: clang++ }
          - { os: macos-26,         cc: clang, cxx: clang++ }
    timeout-minutes: 20
    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DAETHER_WERROR=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 120

  optimized-gcc12:
    name: optimized / gcc12
    needs: sanitizers
    timeout-minutes: 20
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install GCC 12
        run: sudo apt-get update && sudo apt-get install -y g++-12
      - name: Configure
        run: cmake -B build -DCMAKE_CXX_COMPILER=g++-12 -DCMAKE_BUILD_TYPE=Release -DAETHER_WERROR=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 120

  # The current GCC release, whose -O3 analysis reports diagnostics that GCC 12 does not. Ubuntu
  # 24.04 does not package it, so the job runs in the official GCC image, pinned by digest.
  optimized-gcc16:
    name: optimized / gcc16
    needs: sanitizers
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    container: gcc:16.2.0@sha256:07280eb2e744f1b7a2d8d4a3894c089ea07266c109758afc388a634bd098e4eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install CMake and Python
        run: apt-get update && apt-get install -y --no-install-recommends cmake python3
      - name: Configure
        run: cmake -B build -DCMAKE_CXX_COMPILER=g++ -DCMAKE_BUILD_TYPE=Release -DAETHER_WERROR=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 120

  windows:
    name: windows / msvc
    needs: sanitizers
    timeout-minutes: 20
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # AETHER_WERROR enables /WX, matching the GCC and Clang jobs.
      - name: Configure
        run: cmake -B build -DAETHER_WERROR=ON
      - name: Build
        run: cmake --build build --config Debug --parallel 2
      - name: Test
        run: ctest --test-dir build -C Debug --output-on-failure --timeout 120

  # Build and run an outside consumer, including the exported platform dependencies.
  # Match Release configurations for both single- and multi-config generators.
  package:
    name: package / ${{ matrix.os }}
    needs: [build-test, windows, optimized-gcc12, optimized-gcc16]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26, windows-2025]
    timeout-minutes: 20
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure aether
        run: cmake -B build ${{ runner.os != 'Windows' && '-DCMAKE_BUILD_TYPE=Release' || '' }} -DAETHER_WERROR=ON -DAETHER_BUILD_TESTS=OFF -DAETHER_BUILD_BENCHMARKS=OFF -DAETHER_EXAMPLES=OFF
      - name: Build aether
        run: cmake --build build --target aether --config Release --parallel 2
      - name: Install aether
        run: cmake --install build --prefix "${{ runner.temp }}/aether-prefix" --config Release
      - name: Configure consumer against the installed package
        run: cmake -S test/package -B test/package/build -DCMAKE_PREFIX_PATH="${{ runner.temp }}/aether-prefix" ${{ runner.os != 'Windows' && '-DCMAKE_BUILD_TYPE=Release' || '' }}
      - name: Build consumer
        run: cmake --build test/package/build --config Release --parallel 2
      - name: Run installed consumer
        run: ctest --test-dir test/package/build -C Release --output-on-failure --timeout 30
