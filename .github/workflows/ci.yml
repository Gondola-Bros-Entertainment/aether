name: ci

on:
  push:
    branches: [main]
  pull_request:

# Staged pipeline: cheap checks first, expensive last. Each stage runs only if the previous one
# passed (needs:), so the multi-compiler matrix never burns minutes on code the linters or
# sanitizers already rejected:  cppcheck -> sanitizers -> build matrix.
jobs:
  cppcheck:
    name: cppcheck
    runs-on: ubuntu-24.04
    env:
      CPPCHECK_VERSION: 2.21.0
    steps:
      - uses: actions/checkout@v5
      - name: Cache cppcheck
        id: cppcheck-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cppcheck
          key: cppcheck-${{ env.CPPCHECK_VERSION }}-ubuntu24-${{ runner.arch }}-v1
      - name: Check out cppcheck source
        if: steps.cppcheck-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v5
        with:
          repository: cppcheck-opensource/cppcheck
          ref: e73bf44c3e49686b7495fab352d03a6c6075516b # 2.21.0
          path: .tools/cppcheck
          persist-credentials: false
      - name: Build cppcheck
        if: steps.cppcheck-cache.outputs.cache-hit != 'true'
        run: |
          cmake -S .tools/cppcheck -B "$RUNNER_TEMP/cppcheck-build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/cppcheck" \
            -DBUILD_GUI=OFF -DBUILD_TESTS=OFF
          cmake --build "$RUNNER_TEMP/cppcheck-build" --parallel 2
          cmake --install "$RUNNER_TEMP/cppcheck-build"
      - name: Run cppcheck
        run: |
          "$RUNNER_TEMP/cppcheck/bin/cppcheck" --version
          test "$("$RUNNER_TEMP/cppcheck/bin/cppcheck" --version)" = "Cppcheck $CPPCHECK_VERSION"
          "$RUNNER_TEMP/cppcheck/bin/cppcheck" \
            --enable=warning,performance,portability --std=c++20 \
            --error-exitcode=1 --quiet -I include src test bench

  sanitizers:
    name: asan + ubsan
    needs: cppcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -B build -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -g"
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure

  build-test:
    name: ${{ matrix.os }} / ${{ matrix.cc }}
    needs: sanitizers
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, cc: gcc,   cxx: g++ }
          - { os: ubuntu-latest, cc: clang, cxx: clang++ }
          - { os: macos-latest,  cc: clang, cxx: clang++ }
    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -B build -DAETHER_WERROR=ON
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows:
    name: windows / msvc
    needs: sanitizers
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      # Existing tests still use assert(), so run them in Debug to keep those checks active.
      # AETHER_WERROR enables /WX, matching the GCC and Clang jobs.
      - name: Configure
        run: cmake -B build -DAETHER_WERROR=ON
      - name: Build
        run: cmake --build build --config Debug
      - name: Test
        run: ctest --test-dir build -C Debug --output-on-failure

  # Prove the install/export rules: install aether to a prefix, then consume it from a SEPARATE
  # project via find_package(aether) -> aether::aether. Covers the Windows leg too, where the
  # exported target carries ws2_32/bcrypt. Release on both sides so the imported config matches on
  # multi-config generators (MSVC); -DCMAKE_BUILD_TYPE covers single-config, --config multi-config.
  package:
    name: package / ${{ matrix.os }}
    needs: [build-test, windows]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Configure aether
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build aether
        run: cmake --build build --target aether --config Release
      - name: Install aether
        run: cmake --install build --prefix "${{ runner.temp }}/aether-prefix" --config Release
      - name: Configure consumer against the installed package
        run: cmake -S test/package -B test/package/build -DCMAKE_PREFIX_PATH="${{ runner.temp }}/aether-prefix" -DCMAKE_BUILD_TYPE=Release
      - name: Build consumer
        run: cmake --build test/package/build --config Release
