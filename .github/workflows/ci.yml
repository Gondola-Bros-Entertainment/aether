name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Gate compiler and package builds on static analysis and sanitizer tests.
jobs:
  cppcheck:
    name: cppcheck
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    env:
      CPPCHECK_VERSION: 2.21.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache cppcheck
        id: cppcheck-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cppcheck
          key: cppcheck-${{ env.CPPCHECK_VERSION }}-ubuntu24-${{ runner.arch }}-v1
      - name: Check out cppcheck source
        if: steps.cppcheck-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cppcheck-opensource/cppcheck
          ref: e73bf44c3e49686b7495fab352d03a6c6075516b # 2.21.0
          path: .tools/cppcheck
          persist-credentials: false
      - name: Build cppcheck
        if: steps.cppcheck-cache.outputs.cache-hit != 'true'
        run: |
          cmake -S .tools/cppcheck -B "$RUNNER_TEMP/cppcheck-build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/cppcheck" \
            -DBUILD_GUI=OFF -DBUILD_TESTS=OFF
          cmake --build "$RUNNER_TEMP/cppcheck-build" --parallel 2
          cmake --install "$RUNNER_TEMP/cppcheck-build"
      - name: Run cppcheck
        run: |
          "$RUNNER_TEMP/cppcheck/bin/cppcheck" --version
          test "$("$RUNNER_TEMP/cppcheck/bin/cppcheck" --version)" = "Cppcheck $CPPCHECK_VERSION"
          "$RUNNER_TEMP/cppcheck/bin/cppcheck" \
            --enable=warning,performance,portability --std=c++20 \
            --error-exitcode=1 --quiet -I include src test bench examples

  sanitizers:
    name: asan + ubsan
    needs: cppcheck
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DAETHER_WERROR=ON -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -g"
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 120

  build-test:
    name: ${{ matrix.os }} / ${{ matrix.cc }}
    needs: sanitizers
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, cc: gcc,   cxx: g++ }
          - { os: ubuntu-latest, cc: clang, cxx: clang++ }
          - { os: macos-latest,  cc: clang, cxx: clang++ }
    timeout-minutes: 20
    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DAETHER_WERROR=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 120

  windows:
    name: windows / msvc
    needs: sanitizers
    timeout-minutes: 20
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Existing tests still use assert(), so run them in Debug to keep those checks active.
      # AETHER_WERROR enables /WX, matching the GCC and Clang jobs.
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DAETHER_WERROR=ON
      - name: Build
        run: cmake --build build --config Debug --parallel 2
      - name: Test
        run: ctest --test-dir build -C Debug --output-on-failure --timeout 120

  # Build and run an outside consumer, including the exported platform dependencies.
  # Match Release configurations for both single- and multi-config generators.
  package:
    name: package / ${{ matrix.os }}
    needs: [build-test, windows]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    timeout-minutes: 20
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure aether
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DAETHER_WERROR=ON -DAETHER_BUILD_TESTS=OFF -DAETHER_BUILD_BENCHMARKS=OFF -DAETHER_EXAMPLES=OFF
      - name: Build aether
        run: cmake --build build --target aether --config Release --parallel 2
      - name: Install aether
        run: cmake --install build --prefix "${{ runner.temp }}/aether-prefix" --config Release
      - name: Configure consumer against the installed package
        run: cmake -S test/package -B test/package/build -DCMAKE_PREFIX_PATH="${{ runner.temp }}/aether-prefix" -DCMAKE_BUILD_TYPE=Release
      - name: Build consumer
        run: cmake --build test/package/build --config Release --parallel 2
      - name: Run installed consumer
        run: ctest --test-dir test/package/build -C Release --output-on-failure --timeout 30
